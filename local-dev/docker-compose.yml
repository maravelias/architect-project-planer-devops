name: archplan-local-stack

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: archplan-postgres
    restart: always
    environment:
      POSTGRES_DB: archplan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: P@ssw0rd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archplan"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      archplan-network:
        ipv4_address: 172.50.0.10


  pgadmin:
    image: dpage/pgadmin4:9.11.0
    container_name: archplan-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      archplan-network:
        ipv4_address: 172.50.0.19

  sonar-db:
    image: postgres:17
    container_name: archplan-sonar-db
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      archplan-network:
        ipv4_address: 172.50.0.12

  sonarqube:
    image: sonarqube:26.1.0.118079-community
    container_name: archplan-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
    networks:
      archplan-network:
        ipv4_address: 172.50.0.13

  sonar-init:
    image: alpine:3.20
    container_name: archplan-sonar-init
    depends_on:
      sonarqube:
        condition: service_started
    volumes:
      - ./sonarqube/init-projects.sh:/init-projects.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl bash && /init-projects.sh"]
    networks:
      archplan-network:
        ipv4_address: 172.50.0.20

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: archplan-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      archplan-network:
        ipv4_address: 172.50.0.14

  loki:
    image: grafana/loki:2.9.17
    container_name: archplan-loki
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      archplan-network:
        ipv4_address: 172.50.0.15


  nginx:
    image: nginx:1.29.4-alpine
    container_name: archplan-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q 'Archplan Local Stack' "]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      archplan-network:
        ipv4_address: 172.50.0.16



  grafana:
    image: grafana/grafana-oss:12.1.1
    container_name: archplan-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      archplan-network:
        ipv4_address: 172.50.0.17

  mailhog:
    image: mailhog/mailhog:latest
    container_name: archplan-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      archplan-network:
        ipv4_address: 172.50.0.18


volumes:
  postgres-data:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  prometheus-data:
  grafana-storage:
  loki-data:
  pgadmin-data:


networks:
  archplan-network:
    driver: bridge
    name: archplan-network
    ipam:
      driver: default
      config:
        - subnet: 172.50.0.0/24
          gateway: 172.50.0.1
